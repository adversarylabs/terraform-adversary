name: infra/terraform
version: 0.0.10
description: Reviews Terraform for public exposure, secrets in HCL, encryption, and module pinning.

triggers:
  manual: true
  files_changed:
    - "**/*.tf"
    - "**/*.tf.json"

detection:
  files:
    - "**/*.tf"
    - "**/*.tf.json"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write:
      - .adversary/results
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
